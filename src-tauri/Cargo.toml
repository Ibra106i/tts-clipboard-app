[package]
name = "app"
version = "0.1.0"
description = "Offline read-aloud library and clipboard narrator"
authors = ["Ibrahim"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
arboard = "3"
lopdf = "0.34"
epub = "2"
scraper = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.58", features = [
    "Win32_Media_Speech",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

# Lints live here rather than in CI flags so `cargo clippy` locally enforces the
# same bar as the pipeline. `unsafe` is not forbidden (Win32 COM requires it),
# but unsafe operations inside unsafe functions must be explicit, and no debug
# or placeholder code may ship.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
manual_let_else = "warn"
redundant_clone = "warn"
