[package]
name = "app"
version = "1.0.0"
description = "Offline read-aloud library and clipboard narrator"
authors = ["Ibrahim"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
arboard = "3"
lopdf = "0.34"
epub = "2"
scraper = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "^0.10"

# SAPI 5 lives behind the Windows target so the crate still checks on other
# platforms (where `tts_stub.rs` reports an explicit unsupported-platform error
# instead of failing at link time). The version tracks the one Tauri already
# pulls in transitively, so only a single copy of the windows bindings is built.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Media_Speech",
    "Win32_System_Com",
    "Win32_Media_Audio",
] }

# Lints live here rather than in CI flags so `cargo clippy` locally enforces the
# same bar as the pipeline. `unsafe` is not forbidden (Win32 COM requires it),
# but unsafe operations inside unsafe functions must be explicit, and no debug
# or placeholder code may ship.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
# Every `unsafe` block must justify itself in a comment. SAPI needs unsafe, but
# it must never need an unexplained one.
undocumented_unsafe_blocks = "warn"
manual_let_else = "warn"
redundant_clone = "warn"

# Release builds optimise for size (a desktop utility ships faster and starts
# faster when small). LTO and one codegen unit trade build time for runtime
# quality, which is the right trade for a released binary built rarely.
#
# Debug info is kept deliberately, and this setting and the comment above it used
# to contradict each other: the profile stripped symbols while claiming to keep
# them "for profiling crashes". A backtrace without symbols is close to
# useless, so `debug = 1` is set and stripping left to the installer. It costs
# disk, not runtime.
#
# `panic` is set for the same reason. Aborting means any panic anywhere kills
# the process with no unwinding, so the COM voice is never released, its
# apartment is never torn down, and a staged import's temporary file is left
# behind. Unwinding lets the actor's failure be a stopped playback instead of a
# dead application, which is the difference between a recoverable fault and a
# lost session.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
debug = 1
panic = "unwind"

# Debug builds are what a crash is diagnosed against, so they keep full debug
# info and unwind too. The panic hook in `lib.rs` writes the backtrace into the
# rotating log, and it can only do that if the frames resolve.
[profile.dev]
debug = 2
panic = "unwind"
